name: WeaveOS components
on:
  push:
    branches: ['task/V030-042-*']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:weaveos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weaveos-browser-evidence
          path: test-results/
          retention-days: 14
